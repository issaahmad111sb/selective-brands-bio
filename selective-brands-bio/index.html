<style>
  :root{
    --bg:#F6F3F0;
    --navy:#14303F;
    --burgundy:#8B1F41;
    --taupe:#B3A298;
    --rose:#E9547D;
    --amber:#FBBF24;
    --gold:#C9A96E;
    --chip:#FDFCFA;
    --shadow-card: 0 1px 2px rgba(20,48,63,.07), 0 10px 26px rgba(20,48,63,.09);
    --shadow-card-hover: 0 2px 4px rgba(20,48,63,.08), 0 16px 38px rgba(20,48,63,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg);
    font-family:"IBM Plex Sans Arabic","Noto Kufi Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--navy);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100svh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    /* بانر سادة: تدرج أزرق اللوغو فقط، دون أي نقشة */
    background-color:#16303D;
    background-image:radial-gradient(130% 95% at 50% 0%, #1D3C4C 0%, #16303D 55%, #11252F 100%);
    border-radius:0 0 30px 30px;
    padding:calc(24px + env(safe-area-inset-top)) 20px 24px;
    text-align:center;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(201,169,110,.35), 0 12px 32px rgba(20,48,63,.18);
  }
  .logo-badge{
    position:relative;
    display:inline-block;
    line-height:0;
    background:#FFFFFF;
    border-radius:22px;
    padding:5px 24px;
    box-shadow:0 8px 26px rgba(0,0,0,.28), inset 0 0 0 1px rgba(201,169,110,.45);
  }
  .logo-badge img{
    display:block;
    height:82px;
    width:auto;
  }
  .tagline{
    position:relative;
    margin:14px 0 0;
    color:#F6F3F0;
    font-size:15.5px;
    font-weight:400;
    letter-spacing:.01em;
  }
  .tagline::after{
    content:"";
    display:block;
    width:46px;height:1.5px;
    margin:12px auto 0;
    background:var(--gold);
    border-radius:2px;
    opacity:.85;
  }

  main{padding:26px 16px 0}

  /* ---------- Section titles ---------- */
  .section-title{
    margin:0 0 16px;
    font-size:19px;
    font-weight:700;
    color:var(--navy);
    text-align:center;
  }
  .section-title::after{
    content:"";
    display:block;
    width:42px;height:2px;
    margin:9px auto 0;
    background:linear-gradient(90deg,var(--gold),rgba(201,169,110,.25));
    border-radius:2px;
  }
  section{margin-bottom:30px}

  /* ---------- Brand cards ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    padding:16px 14px 14px;
    border-radius:16px;
    text-decoration:none;
    border:1px solid rgba(201,169,110,.45); /* خط ذهبي شامبين رفيع */
    box-shadow:var(--shadow-card);
    transition:transform .22s ease, box-shadow .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover)}
  .card:active{transform:translateY(-1px) scale(.985);box-shadow:var(--shadow-card)}
  .card:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px}
  .card[aria-disabled="true"]{opacity:.55}

  /* منطقة الشعار: ارتفاع ثابت والشعار في المنتصف */
  .card .logo-area{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card .brand-logo{
    max-height:64px;
    max-width:82%;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
  }
  /* بديل نصي إذا فشل تحميل الشعار */
  .card .logo-fallback{
    font-size:22px;
    font-weight:700;
    line-height:1.2;
    text-align:center;
    padding:0 6px;
  }
  /* زر "اشتري" بعرض البطاقة كاملاً */
  .card .buy{
    margin-top:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    border-radius:12px;
    font-size:14px;
    font-weight:500;
    text-align:center;
    border:1px solid rgba(201,169,110,.55);
  }

  /* ---------- Social ---------- */
  .social{display:flex;flex-direction:column;gap:11px}
  .social-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center; /* الأيقونة والنص في المنتصف معاً */
    gap:13px;
    min-height:56px;
    padding:0 18px;
    background:#FFFFFF;
    border:1px solid rgba(20,48,63,.08);
    border-radius:14px;
    box-shadow:0 1px 2px rgba(20,48,63,.05), 0 6px 18px rgba(20,48,63,.06);
    color:var(--navy);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    transition:transform .22s ease, box-shadow .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .social-btn:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,48,63,.06), 0 12px 28px rgba(20,48,63,.11)}
  .social-btn:active{transform:translateY(0) scale(.99)}
  .social-btn:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px}
  .social-btn svg{width:20px;height:20px;flex:none}
  .social-btn .arrow{
    position:absolute;
    inset-inline-start:18px; /* السهم ثابت عند الحافة حتى لا يكسر توسيط المحتوى */
    width:16px;height:16px;
    color:var(--taupe);
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top:auto;
    padding:10px 16px calc(22px + env(safe-area-inset-bottom));
    text-align:center;
  }
  footer .line{
    width:58px;height:1.5px;
    margin:0 auto 13px;
    background:linear-gradient(90deg,rgba(201,169,110,.2),var(--gold),rgba(201,169,110,.2));
    border-radius:2px;
  }
  footer p{
    margin:0;
    font-size:12px;
    color:#8C8177;
    letter-spacing:.05em;
  }

  /* ---------- Load animation ---------- */
  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }
  .reveal{opacity:0;animation:rise .5s ease forwards}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .reveal{opacity:1}
  }
</style>

/* تفتيح/تغميق لون hex بنسبة صغيرة لصناعة تدرج خفيف من نفس لون البطاقة */
function shade(hex, pct){
  const n = parseInt(hex.slice(1), 16);
  const t = pct < 0 ? 0 : 255, p = Math.abs(pct) / 100;
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const c = v => Math.round((t - v) * p + v);
  return "#" + (0x1000000 + c(r) * 0x10000 + c(g) * 0x100 + c(b)).toString(16).slice(1);
}

  const s = document.createElement("span");
  s.className = "logo-fallback";
  s.textContent = img.alt;
  img.replaceWith(s);

const ARROW_ICON = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';

const grid = document.getElementById("brandGrid");
LINKS.brands.forEach(function(b, i){
  const slug = b.name.toLowerCase().trim().replace(/\s+/g, "-"); /* مطابق لاسم ملف الشعار وحدث Umami */
  const hasUrl = b.url && b.url !== "#";
  const label = "اشتري " + b.name;
  const size = LOGO_SIZE[slug] || [800, 200];
  /* خلفية الزر: طبقة شفافة خفيفة — بيضاء على البطاقات الداكنة، كحلية على الفاتحة */
  const buyBg = (b.fg.toUpperCase() === "#FFFFFF") ? "rgba(255,255,255,.10)" : "rgba(20,48,63,.05)";

  const inner =
    '<span class="logo-area">' +
      '<img class="brand-logo" src="logos/' + slug + '.png" alt="' + b.name + '" ' +
        'width="' + size[0] + '" height="' + size[1] + '" ' +
        'loading="' + (i < 4 ? "eager" : "lazy") + '" decoding="async" onerror="logoFallback(this)">' +
    '</span>' +
    '<span class="buy" style="background:' + buyBg + '">' + label + '</span>';

  let el;
  if(hasUrl){
    el = document.createElement("a");
    el.href = withUtm(b.url);
    /* تتبع Umami: brand- + slug صغير من اسم الماركة (المسافات تصبح شرطات) */
    el.setAttribute("data-umami-event", "brand-" + slug);
    el.setAttribute("data-umami-event-type", "brand");
    el.setAttribute("aria-label", label + (b.ar ? " — " + b.ar : ""));
  } else {
    el = document.createElement("div");
    el.setAttribute("aria-disabled", "true");
    el.setAttribute("aria-label", b.name + " — غير متاح حالياً");
  }
  el.className = "card reveal";
  /* الخلفية والنص من حقول bg/fg في الإعدادات، مع تدرج خفيف مشتق من bg */
  el.style.background = "linear-gradient(180deg," + shade(b.bg, 5) + " 0%," + shade(b.bg, -5) + " 100%)";
  el.style.color = b.fg;
  el.style.animationDelay = (i * 60) + "ms";
  el.innerHTML = inner;
  grid.appendChild(el);
});

const nav = document.getElementById("socialNav");
Object.keys(LINKS.social).forEach(function(key, i){
  const url = LINKS.social[key];
  const hasUrl = url && url !== "#";
  const pretty = key.charAt(0).toUpperCase() + key.slice(1);
  let el;
  if(hasUrl){
    el = document.createElement("a");
    el.href = url;
    /* تتبع Umami: social- + اسم المنصة */
    el.setAttribute("data-umami-event", "social-" + key);
    el.setAttribute("data-umami-event-type", "social");
    el.setAttribute("aria-label", "تابع Selective Brands على " + pretty);
  } else {
    el = document.createElement("div");
    el.setAttribute("aria-disabled", "true");
  }
  el.className = "social-btn reveal";
  el.style.animationDelay = (LINKS.brands.length * 60 + i * 60) + "ms";
  el.innerHTML = SOCIAL_ICONS[key] + '<span>' + pretty + '</span>' + ARROW_ICON;
  nav.appendChild(el);
});

   وإن حُجب السكربت تبقى الروابط تعمل طبيعياً لأنها وسوم <a href> عادية. */
